# clang-format Helper — Apache virtual host.
#
# The app is a fully static site; this only serves files.
#
#   1. Copy clang-format-helper.rules.conf somewhere Apache can read it but does
#      NOT load on its own (Debian/Ubuntu: /etc/apache2/, RHEL/Fedora/Arch: /etc/httpd/conf/).
#      Not conf.d/, and do not a2enconf it: loaded at server level it still starts
#      cleanly, but precompression silently stops working and its headers and
#      caching rules apply to every other site on the server.
#   2. Copy this file to the vhost directory
#      (Debian/Ubuntu: /etc/apache2/sites-available/ then `a2ensite clang-format-helper`,
#       RHEL/Fedora: /etc/httpd/conf.d/, Arch: /etc/httpd/conf/extra/ + an Include).
#   3. Set ServerName, the two paths, and the Include path below.
#   4. Enable the modules (Debian/Ubuntu: `a2enmod rewrite headers brotli deflate`).
#   5. apachectl configtest && systemctl reload apache2   (or httpd)
#
# See docs/deployment.md for HTTPS, sub-paths, shared hosting (.htaccess), and
# verifying the result with `npm run check:deploy`.

<VirtualHost *:80>
    ServerName clang-format.example.com

    # The directory containing index.html — i.e. the *contents* of dist/.
    DocumentRoot "/var/www/clang-format-helper"

    <Directory "/var/www/clang-format-helper">
        Require all granted
        AllowOverride None
        Include /etc/apache2/clang-format-helper.rules.conf
    </Directory>
</VirtualHost>

# Serving from a sub-path of an existing site instead? Drop the <VirtualHost> and
# add this to that site's configuration:
#
# Alias /tools/clang-format "/var/www/clang-format-helper"
# <Directory "/var/www/clang-format-helper">
#     Require all granted
#     AllowOverride None
#     Include /etc/apache2/clang-format-helper.rules.conf
#     # Only needed before Apache 2.4.13; harmless after.
#     RewriteBase /tools/clang-format/
# </Directory>
