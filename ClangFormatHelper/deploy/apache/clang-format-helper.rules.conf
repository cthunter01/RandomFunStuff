# clang-format Helper — Apache rules.
#
# One file, usable two ways, so there is only ever one copy of the rules:
#
#   * Included inside <Directory> in a virtual host (see clang-format-helper.conf).
#     Preferred: Apache then does not look for .htaccess on every request.
#   * Copied to .htaccess in the app's directory, for shared hosting where you
#     cannot edit the server config. That needs `AllowOverride FileInfo Indexes
#     Options` (most hosts allow `All`).
#
# Required modules: mod_rewrite, mod_headers, mod_mime, mod_env.
# Optional: mod_brotli, mod_deflate, mod_filter — only used to compress on the fly
# when the precompressed files from `npm run release` are missing.
#
# Serving under an Alias (e.g. `Alias /tools/clang-format /var/www/...`)? Apache
# 2.4.13 and later resolve that on their own. On anything older, add
#   RewriteBase /tools/clang-format/
# or the precompressed-file rewrites below resolve against the wrong path.

Options -Indexes -MultiViews
DirectoryIndex index.html

# WebAssembly.compileStreaming requires exactly this type. Apache's bundled
# mime.types has it, but many distribution configs predate it.
AddType application/wasm .wasm
# Source maps are JSON; without this they go out as octet-stream.
AddType application/json .map
# clang-tidy's header bundle. Any type works for fetch(); this one is honest.
AddType application/x-tar .tar

<IfModule mod_rewrite.c>
    RewriteEngine On

    # Never serve dotfiles (.htaccess itself, .git, ...).
    RewriteRule (^|/)\. - [F]

    # Answer with the precompressed sibling when the client accepts it — brotli
    # first, about 20% smaller than gzip for the wasm module. The URL does not
    # change; only which file on disk answers it.
    RewriteCond %{HTTP:Accept-Encoding} \bbr\b
    RewriteCond %{REQUEST_FILENAME}.br -f
    RewriteRule ^(.+)$ $1.br [L]

    RewriteCond %{HTTP:Accept-Encoding} \bgzip\b
    RewriteCond %{REQUEST_FILENAME}.gz -f
    RewriteRule ^(.+)$ $1.gz [L]
</IfModule>

# A precompressed file must: declare its encoding, carry the type of the file it
# stands in for (Apache would otherwise call a .gz application/x-gzip), and be
# exempt from on-the-fly compression. Missing that last part compresses it twice,
# which browsers cannot decode — and they report it only as a generic failure.
<FilesMatch "\.br$">
    Header set Content-Encoding br
    SetEnv no-brotli 1
    SetEnv no-gzip 1
</FilesMatch>
<FilesMatch "\.gz$">
    Header set Content-Encoding gzip
    SetEnv no-brotli 1
    SetEnv no-gzip 1
</FilesMatch>
<FilesMatch "\.js\.(br|gz)$">
    ForceType text/javascript
</FilesMatch>
<FilesMatch "\.css\.(br|gz)$">
    ForceType text/css
</FilesMatch>
<FilesMatch "\.wasm\.(br|gz)$">
    ForceType application/wasm
</FilesMatch>
<FilesMatch "\.html\.(br|gz)$">
    ForceType "text/html; charset=utf-8"
</FilesMatch>
<FilesMatch "\.(json|map)\.(br|gz)$">
    ForceType application/json
</FilesMatch>
<FilesMatch "\.tar\.(br|gz)$">
    ForceType application/x-tar
</FilesMatch>

# On-the-fly compression, for a plain `npm run build` with no precompressed files.
<IfModule mod_filter.c>
    <IfModule mod_brotli.c>
        AddOutputFilterByType BROTLI_COMPRESS text/html text/css text/javascript application/javascript application/json application/wasm application/x-tar image/svg+xml
    </IfModule>
    <IfModule mod_deflate.c>
        AddOutputFilterByType DEFLATE text/html text/css text/javascript application/javascript application/json application/wasm application/x-tar image/svg+xml
    </IfModule>
</IfModule>

<IfModule mod_headers.c>
    # Everything in assets/ has a content hash in its name, so a given URL never
    # changes: cache it for a year and skip revalidation. The entry point must
    # always be revalidated, because it names the current hashes and a cached copy
    # would keep pointing at files a later deploy removed. (The optional .br/.gz
    # suffix is there because after the rewrite above, the request being answered
    # is the precompressed file.)
    <If "%{REQUEST_URI} =~ m#/assets/[^/]+\.(?:js|css|wasm|map|tar)(?:\.br|\.gz)?$#">
        Header set Cache-Control "public, max-age=31536000, immutable"
    </If>
    <Else>
        Header set Cache-Control "no-cache"
    </Else>

    # Responses differ by Accept-Encoding; shared caches must know that.
    Header merge Vary Accept-Encoding

    Header always set X-Content-Type-Options "nosniff"
    Header always set Referrer-Policy "no-referrer"
    Header always set X-Frame-Options "SAMEORIGIN"
    Header always set Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()"

    # Optional but recommended — see the notes in deploy/nginx/clang-format-helper-headers.conf.
    # 'wasm-unsafe-eval' is required to compile the wasm modules; the sha256
    # allows the inline theme script in index.html.
    # Header always set Content-Security-Policy "default-src 'self'; script-src 'self' 'sha256-IBRmPENIcyuBGJYJgtdNtA+MSY2Afterh32qYn1oklE=' 'wasm-unsafe-eval'; style-src 'self'; img-src 'self' data:; connect-src 'self'; worker-src 'self'; object-src 'none'; base-uri 'self'; form-action 'none'; frame-ancestors 'self'"
</IfModule>
