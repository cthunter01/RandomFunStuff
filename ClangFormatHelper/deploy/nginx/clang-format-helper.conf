# clang-format Helper — nginx server block.
#
# The app is a fully static site: nothing here proxies to or runs anything.
#
#   1. Copy this file to /etc/nginx/conf.d/ (or sites-available/ plus a symlink in
#      sites-enabled/, on Debian/Ubuntu).
#   2. Copy clang-format-helper-headers.conf to /etc/nginx/snippets/.
#   3. Set server_name and root below.
#   4. nginx -t && systemctl reload nginx
#
# See docs/deployment.md for HTTPS, deploying under a sub-path, and verifying the
# result with `npm run check:deploy`.

server {
    listen 80;
    # Remove this line on hosts with IPv6 disabled (common in containers), where
    # nginx refuses to start with "Address family not supported by protocol".
    listen [::]:80;
    server_name clang-format.example.com;

    # The directory containing index.html — i.e. the *contents* of dist/.
    root /var/www/clang-format-helper;
    index index.html;

    # ---- compression ----
    # Serve the .gz files `npm run release` writes next to each asset, when present...
    gzip_static on;
    # ...and compress on the fly for anything without one. text/html is always
    # compressed; application/wasm is NOT in nginx's defaults, and it is by far the
    # largest file (2.5 MB, ~1 MB gzipped), so it has to be listed explicitly.
    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/css application/javascript text/javascript application/json application/wasm image/svg+xml;

    # With the third-party ngx_brotli module installed, also serve the .br files.
    # They are about 20% smaller than gzip for the wasm module.
    # brotli_static on;

    # ---- routing ----
    # Deliberately no single-page-app fallback (`try_files ... /index.html`). This
    # app has no client-side routes, and such a fallback would answer a request for
    # a missing asset with index.html and a 200. The browser then fails with a
    # baffling "not a valid JavaScript MIME type" error instead of a plain 404.
    location / {
        include snippets/clang-format-helper-headers.conf;
        try_files $uri $uri/ =404;
    }

    # The entry point must always be revalidated: it names the current asset hashes,
    # and a cached copy would keep pointing at files a later deploy has removed.
    # Matched as a regex so the same config works at the site root or a sub-path.
    location ~ /index\.html$ {
        include snippets/clang-format-helper-headers.conf;
        add_header Cache-Control "no-cache" always;
    }

    # Everything in assets/ has a content hash in its file name, so a given URL
    # never changes. Cache it for a year, and let the browser skip revalidation.
    location ~* /assets/[^/]+\.(?:js|css|map)$ {
        include snippets/clang-format-helper-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # The wasm module gets its own location so its MIME type is guaranteed.
    # WebAssembly.compileStreaming requires exactly application/wasm, and older
    # nginx packages' mime.types lack it and send application/octet-stream.
    location ~* /assets/[^/]+\.wasm$ {
        types { application/wasm wasm; }
        include snippets/clang-format-helper-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # Never serve dotfiles — an .htaccess left from an Apache deploy, a .git, etc.
    location ~ /\. {
        deny all;
    }
}
