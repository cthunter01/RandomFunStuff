# Security headers for clang-format Helper. Included by every location in
# clang-format-helper.conf.
#
# Why a snippet instead of declaring these once in the server block: nginx has a
# trap here. A location that sets *any* add_header of its own inherits *none* from
# the enclosing block. Every location below sets Cache-Control, so server-level
# headers would silently vanish from every response. (nginx 1.29.3 and later can
# use `add_header_inherit merge;` instead; most distributions ship older.)

add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "no-referrer" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;

# Optional but recommended. Two parts are specific to this app:
#   'wasm-unsafe-eval'  lets the browser compile the clang-format and clang-tidy
#                       WebAssembly modules; without it neither gets past "Loading".
#   'sha256-...'        allows the small inline script in index.html that applies the
#                       saved theme before first paint. If index.html's script changes,
#                       recompute it (docs/deployment.md). A stale hash is not fatal —
#                       the app still applies the theme, just after a brief flash.
#
# add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'sha256-IBRmPENIcyuBGJYJgtdNtA+MSY2Afterh32qYn1oklE=' 'wasm-unsafe-eval'; style-src 'self'; img-src 'self' data:; connect-src 'self'; worker-src 'self'; object-src 'none'; base-uri 'self'; form-action 'none'; frame-ancestors 'self'" always;
